<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Owner — MOTOCARE MOTOR</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><a class="logo" href="index.html"><span class="mark">M</span><span><b>MOTOCARE MOTOR</b><small>Dashboard Owner</small></span></a><nav id="nav"><a href="index.html">Website</a><a href="#" onclick="logout();return false">Keluar</a></nav><div class="tools"><button id="themeBtn" class="icon" aria-label="Ganti tema">◐</button></div></header>
<main class="app"><div class="apptabs"><a id="back" class="btn sm ghost" href="index.html">← Kembali</a><button class="btn sm ghost" onclick="logout()">Keluar</button></div><div class="warn">Data dibaca dari browser/perangkat ini saja. Perubahan di perangkat lain tidak muncul otomatis; untuk itu perlu database server (mis. Firebase).</div>
<div class="apptabs"><button class="btn sm ghost" id="simBtn">▶ Mulai simulasi live</button><button class="btn sm ghost" id="csv">Ekspor transaksi CSV</button></div>
<div id="st"></div><h2 style="margin-top:24px">Omzet 7 Hari Terakhir</h2><div id="ch" class="ch card"></div><h2 style="margin-top:24px">Transaksi Terakhir</h2><div id="tx" class="rows"></div>
<h2 style="margin-top:24px">Stok Kritis</h2><div id="kr" class="rows"></div>
<h2 style="margin-top:24px">Aktivitas Staf</h2><div id="lg" class="rows"></div></main><div id="toast"></div>
<script src="core.js"></script>
<script>
const SES=guard(['owner']);
const card=(l,v)=>`<div class="card"><div class="muted">${l}</div><div class="tot">${v}</div></div>`,fd=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}),E=t=>`<div class="empty">${t}</div>`;
function draw(){const s=stats(),T=DB.read(K.tx,[]);
 $('#st').innerHTML='<div class="stats">'+card('Omzet hari ini',rp(s.omzetHari))+card('Total omzet',rp(s.omzetAll))+card('Jumlah transaksi',s.trxAll)+card('Rata-rata transaksi',rp(s.trxAll?Math.round(s.omzetAll/s.trxAll):0))+card('Saldo kas',rp(s.saldo))+card('Kas masuk',rp(s.kasIn))+card('Kas keluar',rp(s.kasOut))+card('Antrean aktif',s.aktif)+card('Motor masuk hari ini',s.motorHari)+card('Nilai persediaan',rp(s.nilai))+card('Utang supplier',rp(s.utang))+'</div><p class="muted">Antrean DEMO tidak dihitung. Omzet, kas, dan laba berbeda: laba bersih belum dihitung karena biaya dan harga pokok belum lengkap.</p>';
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d}),tt=days.map(d=>T.filter(t=>t.status==='Lunas'&&new Date(t.t).toDateString()===d.toDateString()).reduce((a,t)=>a+t.total,0)),mx=Math.max(...tt,1);
 $('#ch').innerHTML=days.map((d,i)=>`<div class="bar7"><b>${tt[i]?Math.round(tt[i]/1000)+'k':'0'}</b><i style="height:${Math.max(2,Math.round(tt[i]/mx*110))}px"></i><small>${d.getDate()}/${d.getMonth()+1}</small></div>`).join('');
 $('#tx').innerHTML=T.slice().reverse().slice(0,10).map(t=>`<div class="row"><div><b>${t.id}</b> <span class="badge ${t.status==='Lunas'?'b-ok':'b-bad'}">${t.status}</span></div><div class="muted">${fd(t.t)} · ${esc(t.method)} · ${esc(t.cashier)} · <b>${rp(t.total)}</b></div></div>`).join('')||E('Belum ada transaksi.');
 $('#kr').innerHTML=s.kritis.map(p=>`<div class="row"><b>${esc(p.name)}</b><span class="muted">Stok ${p.stock} / min ${p.min}</span></div>`).join('')||E('Tidak ada stok kritis.');
 $('#lg').innerHTML=DB.read(K.logs,[]).slice().reverse().slice(0,10).map(l=>`<div class="row"><span>${esc(l.a)}</span><span class="muted">${fd(l.t)} · ${esc(l.u)}</span></div>`).join('')||E('Belum ada aktivitas.')}
$('#csv').onclick=()=>{const T=DB.read(K.tx,[]);if(!T.length){toast('Belum ada transaksi');return}const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 download('transaksi-'+today()+'.csv',['ID,Waktu,Metode,Status,Total,Kasir',...T.map(t=>[t.id,t.t,t.method,t.status,t.total,t.cashier].map(q).join(','))].join('\n'),'text/csv')};
$('#themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;DB.write(K.theme,t)};
window.addEventListener('storage',draw);window.addEventListener('mc-data',draw);document.documentElement.dataset.theme=DB.read(K.theme,'dark');draw();
</script></body></html>
