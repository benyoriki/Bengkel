<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Owner — MOTOCARE MOTOR</title><link rel="icon" type="image/png" href="favicon.png"><meta name="theme-color" content="#ff6a1a"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dash.css"></head><body class="dash"><header class="dtop"><a class="logo" href="index.html"><img class="mark" src="logo-sm.png" alt="" width="40" height="40"><span><b>MOTOCARE MOTOR</b><small>Dashboard Owner</small></span></a><div class="dgrow"></div><span class="chip">👑 Owner</span><a class="icon" href="index.html" title="Website" aria-label="Website">🌐</a><button id="themeBtn" class="icon" aria-label="Ganti tema">◐</button><button class="icon" onclick="logout()" title="Keluar" aria-label="Keluar">⎋</button></header>
<main class="app"><div class="warn">Data dibaca dari browser/perangkat ini saja. Perubahan di perangkat lain tidak muncul otomatis; untuk itu perlu database server (mis. Firebase).</div>
<div id="home"><div class="apptabs"><button class="btn sm ghost" id="simBtn">▶ Mulai simulasi live</button><button class="btn sm ghost" id="csv">Ekspor faktur CSV</button></div>
<div id="st"></div><h3 class="sh">Menu Owner</h3><div id="tiles" class="tiles"></div></div>
<div id="sub" hidden><div class="apptabs"><button class="btn sm ghost" data-a="home">← Menu Owner</button></div><h2 id="subT"></h2><div id="subc"></div></div></main><div id="toast"></div>
<script src="core.js"></script><script src="ui.js"></script>
<script>
const SES=guard(['owner']);
let sub='',F={f:addDays(-29),t:today(),q:''},BD=today(),HS=null;
const MENU=[['inc','📈','Income Harian'],['kotor','🧮','Laba Kotor'],['trx','🧾','Jumlah Transaksi'],['bersih','💵','Laba Bersih Harian'],['hutang','📁','Kotak Data Hutang'],['kritis','⚠️','Kotak Stok Kritis']];
const paid=()=>DB.read(K.inv,[]).filter(i=>i.status==='Lunas'),T=i=>invT(i).total,crit=()=>S().crit??10;
const rng=(q)=>`<div class="bar"><label>Dari<input type="date" id="rf" value="${F.f}"></label><label>Sampai<input type="date" id="rt" value="${F.t}"></label>${q?`<label>Cari<input id="rq" type="search" placeholder="no faktur / nama / no. polisi" value="${esc(F.q)}"></label>`:''}<span style="align-self:end;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm ghost" data-a="pre" data-id="0">Hari ini</button><button class="btn sm ghost" data-a="pre" data-id="6">7 hari</button><button class="btn sm ghost" data-a="pre" data-id="29">30 hari</button><button class="btn sm ghost" data-a="print">Cetak</button><button class="btn sm ghost" data-a="csvT">Ekspor CSV</button></span></div>`;
const sel=()=>{const q=F.q.toLowerCase();return paid().filter(i=>i.payDate>=F.f&&i.payDate<=F.t&&(i.no+i.name+i.plat).toLowerCase().includes(q)).sort((a,b)=>a.payDate.localeCompare(b.payDate)||a.no.localeCompare(b.no))};
const incRows=()=>dailyRows(F.f,F.t);
const xt=(h,r,f)=>tbl(h,r,f).replace('<table>','<table class="xl">');
const debts=()=>DB.read(K.purch,[]).filter(b=>b.total-b.paid>0);
const R={
 inc:{bar:()=>rng(0),tb:()=>{const r=incRows(),s=(f)=>sumBy(r,f);return '<h3>Diagram Omzet Harian</h3><div class="card">'+chart(r)+'</div><h3 style="margin-top:16px">Rekap Harian</h3>'+xt(['Tanggal','Total Income','Unit Masuk','Qty Sparepart Terjual','Nilai Sparepart','Return Kendaraan'],r.map(x=>tr([fdd(x.d),'<b>'+rp(x.inc)+'</b>',x.units,x.pq,rp(x.pv),x.ret])).reverse(),`<tr><th>TOTAL</th><th>${rp(s(x=>x.inc))}</th><th>${s(x=>x.units)}</th><th>${s(x=>x.pq)}</th><th>${rp(s(x=>x.pv))}</th><th>${s(x=>x.ret)}</th></tr>`)}},
 kotor:{bar:()=>rng(1),tb:()=>{const L=sel();return xt(['Tanggal','No Faktur Service','Total Biaya Service'],L.map(i=>tr([fdd(i.payDate),'<b>'+esc(i.no)+'</b>',rp(T(i))])),`<tr><th colspan="2">TOTAL (${L.length} faktur)</th><th>${rp(sumBy(L,T))}</th></tr>`)}},
 trx:{bar:()=>rng(1),tb:()=>{const L=sel();return xt(['Tanggal','No Faktur','Total Biaya Service','Faktur'],L.map(i=>tr([fdd(i.payDate),'<b>'+esc(i.no)+'</b>',rp(T(i)),`<button class="btn sm ghost" data-a="view" data-id="${i.id}">View</button>`])),`<tr><th colspan="2">TOTAL (${L.length} transaksi)</th><th colspan="2">${rp(sumBy(L,T))}</th></tr>`)}},
 bersih:{bar:()=>`<div class="bar"><label>Tanggal<input type="date" id="bd" value="${BD}"></label><button class="btn sm ghost" data-a="print" style="align-self:end">Cetak</button></div>`,tb:()=>reportHTML(BD,false)},
 hutang:{bar:()=>'',tb:()=>{const D=debts();if(HS!=null){const L=D.filter(b=>b.supplier===HS),P=DB.read(K.products,[]);return `<div class="apptabs"><button class="btn sm ghost" data-a="hback">← Semua toko</button></div><h3>📁 ${esc(HS)}</h3>`+xt(['Tanggal Faktur','Nama Barang','Qty','Total Harga','Jatuh Tempo','Keterangan'],L.map(b=>{const p=P.find(x=>x.sku===b.sku),od=b.due&&b.due<today();return tr([fdd(b.invDate||dOf(b.t)),esc(p?p.name:b.sku),b.qty,rp(b.total-b.paid),(b.due?fdd(b.due):'-')+(od?' <span class="badge b-bad">Lewat</span>':''),esc([b.invoice&&'Faktur '+b.invoice,b.note].filter(Boolean).join(' · '))])}),`<tr><th colspan="3">TOTAL HUTANG</th><th colspan="3">${rp(sumBy(L,b=>b.total-b.paid))}</th></tr>`)}
  const g={};D.forEach(b=>(g[b.supplier]=g[b.supplier]||[]).push(b));const k=Object.keys(g);return k.length?'<div class="tiles">'+k.map(s=>`<button class="folder" data-a="folder" data-id="${esc(s)}"><span class="ti" style="font-size:1.6rem">📁</span><b>${esc(s)}</b><span class="tot">${rp(sumBy(g[s],b=>b.total-b.paid))}</span><span class="muted">${g[s].length} faktur belum lunas</span></button>`).join('')+'</div>':EMPTY('Tidak ada hutang supplier.')}},
 kritis:{bar:()=>`<div class="bar"><label>Batas stok kritis (pcs)<input type="number" id="cl" min="0" value="${crit()}"></label><button class="btn sm" data-a="saveCrit" style="align-self:end">Simpan batas</button></div>`,tb:()=>{const L=DB.read(K.products,[]).filter(p=>p.stock<=crit()).sort((a,b)=>a.stock-b.stock);return xt(['Nama Sparepart','SKU','Kategori','Stok','Status'],L.map(p=>tr([esc(p.name),esc(p.sku),esc(p.cat),'<b>'+p.stock+'</b>',p.stock<=0?'<span class="badge b-bad">Habis</span>':'<span class="badge b-warn">Kritis</span>'])))}}
};
function draw(){const s=stats();
 $('#st').innerHTML='<div class="stats">'+card('Omzet hari ini',rp(s.omzetHari))+card('Total omzet',rp(s.omzetAll))+card('Jumlah transaksi',s.trxAll)+card('Rata-rata transaksi',rp(s.trxAll?Math.round(s.omzetAll/s.trxAll):0))+card('Saldo kas',rp(s.saldo))+card('Kas masuk',rp(s.kasIn))+card('Kas keluar',rp(s.kasOut))+card('Antrean aktif',s.aktif)+card('Unit masuk hari ini',s.motorHari)+card('Nilai persediaan',rp(s.nilai))+card('Utang supplier',rp(s.utang))+'</div><p class="muted">Antrean DEMO tidak dihitung. Omzet = faktur lunas. Omzet, kas, dan laba berbeda.</p>';
 const sm={inc:rp(s.omzetHari)+' hari ini',kotor:s.trxAll+' faktur lunas',trx:s.trxAll+' transaksi',bersih:'Kas hari ini '+rp(dayReport(today()).cash),hutang:rp(s.utang),kritis:DB.read(K.products,[]).filter(p=>p.stock<=crit()).length+' sparepart'};
 $('#tiles').innerHTML=MENU.map(m=>`<button class="tile" data-open="${m[0]}"><span class="ti">${m[1]}</span><b>${m[2]}</b><span class="muted">${sm[m[0]]}</span></button>`).join('');
 if(sub)drawSub()}
function drawSub(){if($('#tb'))$('#tb').innerHTML=R[sub].tb()}
function openSub(k){sub=k;HS=null;F.q='';$('#home').hidden=!!k;$('#sub').hidden=!k;if(!k){history.replaceState(null,'',location.pathname);draw();return}
 $('#subT').textContent=MENU.find(m=>m[0]===k)[2];$('#subc').innerHTML='<div id="tbar">'+R[k].bar()+'</div><div id="tb"></div>';history.replaceState(null,'','#'+k);drawSub()}
const csvName=()=>'laporan-'+sub+'-'+today()+'.csv';
document.addEventListener('click',e=>{const t=e.target.closest('[data-open]');if(t){openSub(t.dataset.open);return}const bt=e.target.closest('[data-a]');if(!bt)return;const a=bt.dataset.a,id=bt.dataset.id;
 if(a==='home')openSub('');
 if(a==='pre'){F.f=addDays(-id);F.t=today();$('#rf').value=F.f;$('#rt').value=F.t;drawSub()}
 if(a==='folder'){HS=id;drawSub()}if(a==='hback'){HS=null;drawSub()}
 if(a==='view'){const i=DB.read(K.inv,[]).find(x=>x.id===id),m=modal(fakturHTML(i)+'<div class="acts"><button class="btn" id="pv">Cetak</button></div>');m.querySelector('#pv').onclick=()=>printHTML(fakturHTML(i))}
 if(a==='saveCrit'){const v=Math.floor(+$('#cl').value);if(!(v>=0)){toast('Angka tidak valid');return}DB.write(K.settings,{...S(),crit:v});toast('Batas stok kritis: '+v+' pcs');drawSub()}
 if(a==='print'){const h=$('#subT').textContent+' · '+(sub==='bersih'?fdd(BD):fdd(F.f)+' – '+fdd(F.t));printHTML('<h2>MOTOCARE MOTOR — '+h+'</h2>'+$('#tb').innerHTML)}
 if(a==='csvT'){if(sub==='inc')csvDown(csvName(),['Tanggal','Total Income','Unit Masuk','Qty Sparepart','Nilai Sparepart','Return'],incRows().map(x=>[x.d,x.inc,x.units,x.pq,x.pv,x.ret]));
  else csvDown(csvName(),['Tanggal','No Faktur','Total Biaya Service'],sel().map(i=>[i.payDate,i.no,T(i)]))}});
document.addEventListener('change',e=>{const i=e.target.id;if(i==='rf'&&e.target.value){F.f=e.target.value;drawSub()}if(i==='rt'&&e.target.value){F.t=e.target.value;drawSub()}if(i==='bd'&&e.target.value){BD=e.target.value;drawSub()}});
document.addEventListener('input',e=>{if(e.target.id==='rq'){F.q=e.target.value;drawSub()}});
$('#csv').onclick=()=>{const I=DB.read(K.inv,[]).filter(i=>i.status!=='Draft');if(!I.length){toast('Belum ada faktur');return}csvDown('faktur-'+today()+'.csv',['No Faktur','Tanggal','Pelanggan','No Polisi','Status','Metode','Total'],I.map(i=>[i.no,i.date,i.name,i.plat,i.status,i.method||'',T(i)]))};
$('#themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;DB.write(K.theme,t)};
window.addEventListener('storage',draw);window.addEventListener('mc-data',()=>{if($('#md')||(document.activeElement&&document.activeElement.closest('#tbar')))return;draw()});
document.documentElement.dataset.theme=DB.read(K.theme,'dark');
{const h=location.hash.slice(1);if(MENU.some(m=>m[0]===h))openSub(h);else draw()}
</script></body></html>
